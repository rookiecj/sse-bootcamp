<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <!-- Clock face -->
    <circle cx="16" cy="16" r="14" fill="white" stroke="black" stroke-width="2"/>
    <!-- Hour marks -->
    <line x1="16" y1="4" x2="16" y2="6" stroke="black" stroke-width="2"/>
    <line x1="16" y1="26" x2="16" y2="28" stroke="black" stroke-width="2"/>
    <line x1="4" y1="16" x2="6" y2="16" stroke="black" stroke-width="2"/>
    <line x1="26" y1="16" x2="28" y2="16" stroke="black" stroke-width="2"/>
    <!-- Clock hands -->
    <line x1="16" y1="16" x2="16" y2="8" stroke="black" stroke-width="2"/> <!-- Hour hand -->
    <line x1="16" y1="16" x2="22" y2="16" stroke="black" stroke-width="1.5"/> <!-- Minute hand -->
    <!-- Center dot -->
    <circle cx="16" cy="16" r="1.5" fill="black"/>
</svg> 