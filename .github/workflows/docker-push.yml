name: Docker Build and Push

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/docker-push.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: homelab-staging
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Secrets
        run: |
          echo "HARBOR_ROBOT_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME != '' }}"
          echo "HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN != '' }}"
          echo "Registry: ${{ vars.REGISTRY }}"
          echo "Project: ${{ vars.PROJECT }}"
          echo "Image Name: ${{ vars.IMAGE_NAME }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "arm64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./sse_hello
          push: true
          platforms: linux/arm64
          tags: |
            ${{ vars.REGISTRY }}/${{ vars.PROJECT }}/${{ vars.IMAGE_NAME }}:latest
            ${{ vars.REGISTRY }}/${{ vars.PROJECT }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
